name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '**'

jobs:
  build_test:
    name: Test (preact@${{ matrix.preact }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preact: ['^10.0.0', '^11.0.0-0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install preact@${{ matrix.preact }}
        run: npm install --no-save "preact@${{ matrix.preact }}"

      - name: Tests
        run: npm run test
